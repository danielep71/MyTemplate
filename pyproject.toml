# Quality settings for the repository's Python tooling. The tools and tests
# need only the standard library (plus PyYAML for the workflow control tests).
# Ruff and mypy are CI and development tools, installed from
# tools/requirements-quality-ci.txt.

[tool.ruff]
target-version = "py311"
# Formatting target only: E501 is not selected and CI does not run ruff format.
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.11"
files = ["tools"]
pretty = true
show_error_codes = true
warn_unused_configs = true
strict = true
