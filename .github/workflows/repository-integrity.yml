name: Repository integrity

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Test label automation
        run: |
          node .github/scripts/labels-sync.mjs --self-test
          node .github/scripts/labels-sync.mjs --mode validate
          node .github/scripts/labels-drift.mjs --self-test
          python tools/check_issues.py --check-config
      - name: Validate template contents
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -s README.md
          test -s LICENSE
          test -s docs/repo_governance/SETTINGS.md
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
