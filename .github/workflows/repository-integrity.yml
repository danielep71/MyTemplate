name: Repository integrity

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The quality-gate tests fail instead of skipping when a tool is missing.
      REQUIRE_QUALITY_TOOLS: "1"
      # actionlint release and the SHA-256 of its Linux x86_64 archive.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_LINUX_AMD64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pinned configuration parser
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r .github/requirements.txt
      - name: Install hash-locked Python quality tools
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r tools/requirements-quality-ci.txt
      - name: Install checksum-verified actionlint
        run: |
          validator_dir="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          archive="${validator_dir}/actionlint.tar.gz"
          mkdir -p "$validator_dir"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --retry-all-errors \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" \
            | sha256sum --check --strict
          tar --no-same-owner -xzf "$archive" -C "$validator_dir" actionlint
          echo "$validator_dir" >> "$GITHUB_PATH"
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Lint Python tooling (ruff)
        run: ruff check --no-cache tools tests
      - name: Type-check Python tooling (mypy, strict)
        run: mypy --no-incremental
      - name: Lint workflows (actionlint)
        run: actionlint -no-color
      - name: Test label automation
        run: |
          node .github/scripts/labels-sync.mjs --self-test
          node .github/scripts/labels-sync.mjs --mode validate
          node .github/scripts/labels-drift.mjs --self-test
          python tools/check_issues.py --check-config
      - name: Reject template-only content outside the template
        env:
          IS_TEMPLATE: ${{ github.event.repository.is_template }}
        run: |
          if [[ "$IS_TEMPLATE" != "true" ]] && grep -q 'template-only:start' AGENTS.md; then
            echo "::error file=AGENTS.md::Delete the template-only section of AGENTS.md, including its markers, in a generated repository."
            exit 1
          fi
      - name: Check that issue contact links point to this repository
        run: |
          expected="https://github.com/${GITHUB_REPOSITORY,,}/"
          failed=0
          while read -r url; do
            if [[ "${url,,}" != "$expected"* ]]; then
              echo "::error file=.github/ISSUE_TEMPLATE/config.yml::Contact link $url does not point to $GITHUB_REPOSITORY; update it after creating a repository from the template."
              failed=1
            fi
          done < <(sed -n -E 's/^[[:space:]]*url:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' .github/ISSUE_TEMPLATE/config.yml)
          exit "$failed"
      - name: Check that README traffic badges read this repository
        run: |
          expected="${GITHUB_REPOSITORY,,}"
          failed=0
          while read -r repository; do
            if [[ "${repository,,}" != "$expected" ]]; then
              echo "::error file=README.md::A traffic badge reads ${repository}; point it at ${GITHUB_REPOSITORY} or remove it."
              failed=1
            fi
          done < <(grep -o -E 'raw\.githubusercontent\.com/[^/]+/[^/]+/traffic-history/' README.md | cut -d/ -f2,3 | sort -u)
          exit "$failed"
      - name: Check that Dependabot targets existing branches
        run: |
          # fetch-depth: 0 fetches every branch, so each target is a local ref.
          failed=0
          while read -r branch; do
            if ! git rev-parse --verify --quiet "refs/remotes/origin/${branch}" > /dev/null; then
              echo "::error file=.github/dependabot.yml::target-branch ${branch} does not exist; set it to the active release branch or remove it."
              failed=1
            fi
          done < <(sed -n -E 's/^[[:space:]]*target-branch:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' .github/dependabot.yml | sort -u)
          exit "$failed"
      - name: Check that CodeQL runs on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Branch filters cannot name the default branch, so codeql.yml lists
          # it by name; a repository whose default branch is not main must
          # rename it there, or CodeQL runs only on its weekly schedule.
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          import yaml

          path = Path('.github/workflows/codeql.yml')
          if not path.exists():
              sys.exit(0)
          document = yaml.safe_load(path.read_text(encoding='utf-8'))
          triggers = document.get('on', document.get(True)) or {}
          branch = os.environ['DEFAULT_BRANCH']
          failed = False
          for event in ('push', 'pull_request'):
              branches = (triggers.get(event) or {}).get('branches')
              if branches is not None and branch not in branches:
                  print(f'::error file={path}::{event} branches {branches} omit the default branch {branch}; add it.')
                  failed = True
          sys.exit(1 if failed else 0)
          PY
      - name: Validate template contents
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -s README.md
          test -s LICENSE
          test -s docs/repo_governance/SETTINGS.md
          # After a force-push the previous tip is unreachable and was not
          # fetched; check the head commit alone then.
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] \
              && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi

  minimum-python:
    # Not a required check: it confirms the documented Python floor.
    name: Minimum Python (3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pinned configuration parser
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r .github/requirements.txt
      - name: Run repository tests
        run: python -m unittest discover -s tests
