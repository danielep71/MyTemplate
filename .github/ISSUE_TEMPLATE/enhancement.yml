name: "✨ Enhancement"
description: "Report an enhancement task with acceptance criteria and dependencies."
title: "[Enhancement]: "
labels: ["enhancement", "P3"]
assignees: ["danielep71"]
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples and omit secrets. Triage assigns a milestone and confirms priority; P1 is reserved for confirmed calculation bugs."
  - type: textarea
    id: summary
    attributes:
      label: "Summary and impact"
      description: "Describe the proposed change and its value."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Motivation and context"
      description: "Explain the need, the current behavior, and any supporting material such as regulatory text or a worked example."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "Describe how the completed work will be validated."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies and blocking status"
      description: "Name prerequisite issues with #123 or use External condition: followed by the blocker. Write None if unblocked."
    validations:
      required: true
