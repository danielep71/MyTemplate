# Proposes updates to SHA-pinned GitHub Actions and to the pinned configuration
# parser in .github/requirements.txt. Every update arrives as a pull request
# for my review; nothing merges automatically.
# Pull requests target the default branch. If development happens on a
# release branch, set target-branch to that branch.
# Labels must exist in .github/labels.json, include exactly one priority (P3),
# and the assignee must match the issue forms; Repository integrity checks them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - ci
      - P3
    assignees:
      - danielep71
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    labels:
      - ci
      - P3
    assignees:
      - danielep71
    commit-message:
      prefix: ci
    groups:
      configuration-parser:
        patterns:
          - "*"
